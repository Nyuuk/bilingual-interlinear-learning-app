apiVersion: apps/v1
kind: Deployment
metadata:
  name: bila-app
  labels:
    app: bila
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bila
  template:
    metadata:
      labels:
        app: bila
    spec:
      containers:
      - name: bila
        image: bila-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bila-secrets
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: bila-service
spec:
  selector:
    app: bila
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
